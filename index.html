<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Smart E-Book 2026</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0c29">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    
    <style>
        /* 2026 Future Theme */
        :root { 
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            --glass-bg: rgba(20, 20, 28, 0.9);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent: #00f260; 
            --accent-gradient: linear-gradient(90deg, #0575E6, #00f260);
            --text: #ffffff;
        }
        
        body { 
            margin: 0; padding: 0; 
            background: var(--bg-gradient); color: var(--text); 
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
            overflow: hidden; 
            height: 100dvh; width: 100vw; 
            display: flex; flex-direction: column; 
            user-select: none; -webkit-user-select: none; 
            touch-action: none; 
        }
        
        body:fullscreen, #book-container:fullscreen {
            background: #000; width: 100vw; height: 100vh;
        }

        #book-container { 
            flex: 1; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; position: relative; z-index: 1; 
        }
        
        .stf__wrapper { box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        
        /* UI 컨트롤 바 */
        #ui-controls { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 600px;
            background: var(--glass-bg); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            padding: 15px 25px; 
            display: flex; flex-direction: column; gap: 15px; 
            z-index: 10; 
            border-radius: 25px; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        #ui-controls.hidden { transform: translate(-50%, 150%); opacity: 0; pointer-events: none; }
        
        .ui-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        #page-info { font-size: 15px; color: #fff; font-weight: 700; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
        
        #btn-fullscreen-toggle {
            background: rgba(255,255,255,0.15); border: none;
            color: #ccc; padding: 6px 12px; border-radius: 12px; font-size: 13px; cursor: pointer;
            transition: background 0.2s;
        }
        #btn-fullscreen-toggle:hover { background: rgba(255,255,255,0.3); color: #fff; }

        .ui-body { display: flex; align-items: center; justify-content: space-between; gap: 15px; }

        .nav-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.3);
            color: var(--accent); width: 40px; height: 40px; border-radius: 50%;
            font-size: 20px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .nav-btn:active { transform: scale(0.9); background: var(--accent); color: #000; }

        #page-slider { 
            flex-grow: 1; height: 6px; 
            -webkit-appearance: none; background: rgba(255,255,255,0.2); 
            border-radius: 10px; outline: none; cursor: pointer; 
        }
        #page-slider::-webkit-slider-thumb { 
            -webkit-appearance: none; width: 20px; height: 20px; 
            background: var(--accent); border-radius: 50%; cursor: pointer; 
            box-shadow: 0 0 10px var(--accent); border: 2px solid #fff; 
            transition: transform 0.2s; 
        }
        #page-slider::-webkit-slider-thumb:active { transform: scale(1.3); }

        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-gradient); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-upload { background: var(--accent-gradient); color: #fff; border: none; padding: 18px 50px; font-size: 18px; font-weight: 800; border-radius: 50px; box-shadow: 0 0 30px rgba(5, 117, 230, 0.4); margin-bottom: 20px; cursor: pointer; transition: transform 0.2s; }
        .btn-upload:active { transform: scale(0.95); }
        
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 90; font-size: 16px; color: white; background: rgba(0,0,0,0.8); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); text-align: center; line-height: 1.6; width: 280px; border: 1px solid rgba(255,255,255,0.1); }

        #zoom-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 999; display: none; overflow: hidden; backdrop-filter: blur(5px); }
        #zoom-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #zoom-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #zoom-close-btn { position: absolute; top: 30px; right: 30px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); width: 50px; height: 50px; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; backdrop-filter: blur(10px); }
        
        .top-btn-group { position: absolute; top: 20px; right: 20px; z-index: 50; display: none; gap: 10px; }
        .top-btn { border: none; color: white; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        #btn-export { background: linear-gradient(135deg, #667eea, #764ba2); border:none; } 

        #guide-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(30, 30, 40, 0.95); color: #fff; padding: 40px 30px; border-radius: 30px; width: 85%; max-width: 340px; z-index: 200; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1) inset; backdrop-filter: blur(30px); display: none; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: translate(-50%, -40%) scale(0.9); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        .guide-icon { font-size: 48px; margin-bottom: 20px; display: block; }
        .guide-text { font-size: 17px; margin-bottom: 12px; line-height: 1.6; font-weight: 500; color: #eee; }
        .highlight { color: var(--accent); font-weight: 800; }
        .guide-sub { font-size: 13px; color: #aaa; margin-bottom: 30px; }
        .btn-confirm { background: #fff; color: #000; border: none; padding: 14px 0; border-radius: 50px; font-weight: 800; font-size: 16px; cursor: pointer; width: 100%; }
        
        .swipe-hint { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); width: 100px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 10px; z-index: 5; pointer-events: none; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="swipe-hint"></div>

    <div id="guide-popup">
        <span class="guide-icon">👋</span>
        <div class="guide-text">메뉴 열기: 화면 중앙 터치<br>페이지 넘김: 좌우 클릭</div>
        <div class="guide-sub">하단 바에서 페이지를<br>자유롭게 이동할 수 있습니다.</div>
        <button class="btn-confirm" id="btn-guide-close">확인했습니다</button>
    </div>

    <div class="top-btn-group" id="top-buttons">
        <button id="btn-export" class="top-btn">파일 저장</button>
        <button id="btn-reset" class="top-btn">초기화</button>
    </div>

    <div id="start-screen">
        <h2 style="background: linear-gradient(to right, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; font-size: 32px; letter-spacing: -1px;">Smart Library</h2>
        <p style="color:rgba(255,255,255,0.5); margin-bottom: 50px; font-size: 15px;">PC / 태블릿 / 모바일 반응형</p>
        <input type="file" id="file-input" accept="application/pdf" style="display: none;">
        <button class="btn-upload" onclick="document.getElementById('file-input').click()">PDF 불러오기</button>
    </div>

    <div id="loading"><div style="font-size:24px;margin-bottom:15px;">🔮</div>파일 분석 중...<br><span style="font-size:13px; color:#aaa;">잠시만 기다려주세요</span></div>

    <div id="book-container">
        <div id="flipbook"></div>
    </div>

    <div id="ui-controls" class="hidden">
        <div class="ui-header">
            <span id="page-info">0 / 0</span>
            <button id="btn-fullscreen-toggle">전체화면</button>
        </div>
        <div class="ui-body">
            <button class="nav-btn" id="btn-prev">‹</button>
            <input type="range" id="page-slider" min="0" max="100" value="0">
            <button class="nav-btn" id="btn-next">›</button>
        </div>
    </div>

    <div id="zoom-layer">
        <div id="zoom-close-btn">✕</div>
        <div id="zoom-container"><img id="zoom-img" src="" alt="Zoom Image"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const DB_NAME="EbookDB", STORE_NAME="files";
        function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=(e)=>e.target.result.createObjectStore(STORE_NAME); r.onsuccess=(e)=>res(e.target.result); r.onerror=(e)=>rej(e); }); }
        async function saveFileToDB(d){ const db=await openDB(); const tx=db.transaction(STORE_NAME,"readwrite"); tx.objectStore(STORE_NAME).put(d,"currentBook"); return new Promise(r=>tx.oncomplete=r); }
        async function loadFileFromDB(){ const db=await openDB(); const tx=db.transaction(STORE_NAME,"readonly"); const r=tx.objectStore(STORE_NAME).get("currentBook"); return new Promise(res=>{r.onsuccess=()=>res(r.result)}); }
        async function clearDB(){ const db=await openDB(); const tx=db.transaction(STORE_NAME,"readwrite"); tx.objectStore(STORE_NAME).delete("currentBook"); localStorage.removeItem("lastPage"); return new Promise(r=>tx.oncomplete=r); }

        function saveLastPage(i){localStorage.setItem("lastPage",i);} function getLastPage(){return parseInt(localStorage.getItem("lastPage"))||0;}

        const els = {
            fileInput: document.getElementById('file-input'), startScreen: document.getElementById('start-screen'),
            loading: document.getElementById('loading'), bookContainer: document.getElementById('book-container'),
            flipbook: document.getElementById('flipbook'), ui: document.getElementById('ui-controls'),
            slider: document.getElementById('page-slider'), pageInfo: document.getElementById('page-info'),
            zoomLayer: document.getElementById('zoom-layer'), zoomImg: document.getElementById('zoom-img'), zoomClose: document.getElementById('zoom-close-btn'),
            topButtons: document.getElementById('top-buttons'), btnReset: document.getElementById('btn-reset'), btnExport: document.getElementById('btn-export'),
            guidePopup: document.getElementById('guide-popup'), btnGuideClose: document.getElementById('btn-guide-close'),
            btnFullscreen: document.getElementById('btn-fullscreen-toggle'),
            btnPrev: document.getElementById('btn-prev'), btnNext: document.getElementById('btn-next')
        };

        let allPages=[], pageFlip, totalPages=0, currentPDFData=null, zoomInstance=null, singlePageRatio=0.7;
        let touchStartX=0, touchStartY=0, longPressTimer=null, isFlipCooldown=false, lastTouchTime=0;
        let isTwoPageMode = false; 

        window.addEventListener('DOMContentLoaded', async () => {
            const saved = await loadFileFromDB();
            if (saved) { currentPDFData = saved; startViewer(saved.slice(0)); }
        });

        els.fileInput.addEventListener('change', async (e) => {
            const f = e.target.files[0]; if(!f) return;
            const d = await f.arrayBuffer();
            currentPDFData = d; await saveFileToDB(d);
            localStorage.setItem("lastPage", 0); 
            startViewer(d.slice(0)); 
        });

        function startViewer(data) {
            els.startScreen.style.display='none'; els.loading.style.display='block'; els.topButtons.style.display='flex';
            loadPDF(data);
        }

        els.btnReset.addEventListener('click', async()=>{ if(confirm("초기화하시겠습니까?")){ await clearDB(); location.reload(); } });
        els.btnGuideClose.addEventListener('click', (e) => { e.stopPropagation(); els.guidePopup.style.display = 'none'; });
        els.guidePopup.addEventListener('touchstart', (e) => e.stopPropagation());
        els.guidePopup.addEventListener('click', (e) => e.stopPropagation());

        els.btnExport.addEventListener('click', () => {
            if (!currentPDFData || currentPDFData.byteLength === 0) return alert("데이터 오류.");
            els.loading.style.display='block'; els.loading.innerHTML="<div style='font-size:24px;margin-bottom:10px;'>💾</div>파일 생성 중...";
            setTimeout(async () => {
                try {
                    const base64 = await arrayBufferToBase64(currentPDFData.slice(0));
                    downloadPortableHTML(base64);
                } catch(e) { alert("생성 실패: "+e.message); }
                els.loading.style.display='none';
            }, 100);
        });

        function arrayBufferToBase64(buffer) {
            return new Promise((resolve, reject) => {
                const blob = new Blob([buffer], { type: 'application/pdf' });
                const reader = new FileReader();
                reader.onloadend = () => reader.result ? resolve(reader.result.split(',')[1]) : reject(new Error("변환 실패"));
                reader.readAsDataURL(blob);
            });
        }

        async function loadPDF(data) {
            try {
                allPages = []; els.flipbook.innerHTML = "";
                const pdfDoc = await pdfjsLib.getDocument(data).promise;
                const p1 = await pdfDoc.getPage(1);
                const v1 = p1.getViewport({ scale: 1.0 });
                if(v1.width > v1.height * 1.2) { singlePageRatio = (v1.width / 2) / v1.height; } else { singlePageRatio = v1.width / v1.height; }

                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    await page.render({ canvasContext: ctx, viewport }).promise;

                    if (viewport.width > viewport.height * 1.2) {
                        const [l, r] = splitCanvas(canvas);
                        l.dataset.pdfIdx = i; r.dataset.pdfIdx = i;
                        allPages.push(l); allPages.push(r);
                    } else {
                        canvas.classList.add('page-canvas'); canvas.dataset.pdfIdx = i;
                        allPages.push(canvas);
                    }
                    els.loading.innerHTML = `<div>🔮</div>분석 중... (${i}/${pdfDoc.numPages})`;
                }
                els.loading.style.display = 'none';
                initFlipBook();
                setTimeout(() => { els.guidePopup.style.display = 'block'; }, 500);
            } catch (e) {
                console.error(e); alert("오류: " + e.message);
                if(confirm("오류 발생. 데이터를 초기화할까요?")) { await clearDB(); location.reload(); }
            }
        }

        function splitCanvas(o) {
            const w=o.width, h=o.height, hw=Math.floor(w/2);
            const l=document.createElement('canvas'), r=document.createElement('canvas');
            l.width=hw; l.height=h; r.width=hw; r.height=h;
            l.getContext('2d').drawImage(o,0,0,hw,h,0,0,hw,h);
            r.getContext('2d').drawImage(o,hw,0,hw,h,0,0,hw,h);
            return [l,r];
        }

        function initFlipBook() {
            const width = els.bookContainer.clientWidth;
            const height = els.bookContainer.clientHeight;
            if (width <= 0 || height <= 0) { setTimeout(initFlipBook, 100); return; }

            const isLandscape = width > height;
            isTwoPageMode = isLandscape; 

            const padding = isLandscape ? 60 : 30;
            const availableW = width - padding;
            const availableH = height - padding;

            let bookW, bookH;

            if (isLandscape) {
                bookH = availableH;
                bookW = (bookH * singlePageRatio) * 2;
                if (bookW > availableW) {
                    bookW = availableW;
                    bookH = (bookW / 2) / singlePageRatio;
                }
            } else {
                bookH = availableH;
                bookW = bookH * singlePageRatio;
                if (bookW > availableW) {
                    bookW = availableW;
                    bookH = bookW / singlePageRatio;
                }
            }

            bookW = Math.floor(bookW);
            bookH = Math.floor(bookH);

            pageFlip = new St.PageFlip(els.flipbook, {
                width: bookW, height: bookH, size: 'fixed',
                usePortrait: !isLandscape, maxShadowOpacity: 0.5, autoSize: true, showCover: true 
            });

            pageFlip.loadFromHTML(allPages);
            totalPages = pageFlip.getPageCount();
            els.slider.max = totalPages - 1;

            const lp = getLastPage(); 
            if(lp > 0 && lp < totalPages) pageFlip.turnToPage(lp);

            pageFlip.on('flip', (e)=>{ 
                els.pageInfo.innerText = (e.data+1)+' / '+totalPages; 
                els.slider.value=e.data;
                saveLastPage(e.data);
            });
            els.slider.addEventListener('input', (e)=>pageFlip.flip(parseInt(e.target.value)));
            
            // 내비게이션 버튼
            els.btnPrev.addEventListener('click', (e) => { e.stopPropagation(); safeFlip('prev'); });
            els.btnNext.addEventListener('click', (e) => { e.stopPropagation(); safeFlip('next'); });

            els.bookContainer.addEventListener('touchstart', handleTouchStart, {passive: false});
            els.bookContainer.addEventListener('touchend', handleTouchEnd, {passive: false});
            els.bookContainer.addEventListener('mousedown', handleMouseDown);
            els.bookContainer.addEventListener('dblclick', (e) => { 
                e.preventDefault(); 
                handleSmartZoom(e.clientX);
            });
        }

        // 스마트 줌
        function handleSmartZoom(clickX) {
            const currentIdx = pageFlip.getCurrentPageIndex();
            let targetPage = null;
            if (isTwoPageMode) {
                const screenCenter = window.innerWidth / 2;
                if (clickX > screenCenter) {
                    if (currentIdx === 0) { targetPage = allPages[0]; } 
                    else { targetPage = allPages[currentIdx + 1]; }
                } else {
                    if (currentIdx === 0) return; 
                    targetPage = allPages[currentIdx];
                }
            } else {
                targetPage = allPages[currentIdx];
            }
            if (targetPage) openZoomImage(targetPage);
            else if(allPages[currentIdx]) openZoomImage(allPages[currentIdx]);
        }

        function openZoomImage(pageCanvas) {
            els.zoomImg.src = pageCanvas.toDataURL();
            els.zoomLayer.style.display='block';
            if(zoomInstance)zoomInstance.dispose();
            zoomInstance=Panzoom(document.getElementById('zoom-container'),{maxScale:4,minScale:1,contain:'outside'});
            document.getElementById('zoom-container').addEventListener('wheel',zoomInstance.zoomWithWheel);
        }

        // 제스처
        function safeFlip(direction) {
            if (isFlipCooldown) return; 
            isFlipCooldown = true;
            if (direction === 'next') pageFlip.flipNext();
            else pageFlip.flipPrev();
            setTimeout(() => { isFlipCooldown = false; }, 800);
        }

        function handleTouchStart(e) {
            if (e.target.closest('#ui-controls') || e.target.closest('#guide-popup')) return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            lastTouchTime = Date.now();
            longPressTimer = setTimeout(() => {
                if(navigator.vibrate) navigator.vibrate(50);
                const touchX = e.touches[0].clientX;
                if (touchX > window.innerWidth / 2) safeFlip('next'); else safeFlip('prev');
            }, 500);
        }

        function handleTouchEnd(e) {
            if (e.target.closest('#ui-controls') || e.target.closest('#guide-popup')) return;
            clearTimeout(longPressTimer); 
            e.preventDefault(); 
            lastTouchTime = Date.now();
            const tX=e.changedTouches[0].screenX, tY=e.changedTouches[0].screenY; 
            const dX=tX-touchStartX, dY=tY-touchStartY;
            if (Math.abs(dY)>Math.abs(dX) && Math.abs(dY)>50){ 
                if (dY<0) els.ui.classList.remove('hidden'); else els.ui.classList.add('hidden'); 
                return; 
            }
            if (Math.abs(dX)<20&&Math.abs(dY)<20){
                if(touchStartX > window.innerWidth/2) safeFlip('next'); else safeFlip('prev');
            }
        }

        // 중앙 클릭: 메뉴 토글 (모바일/PC 공통)
        function handleMouseDown(e) {
            if (Date.now()-lastTouchTime<1000) return;
            if (e.target.closest('#ui-controls') || e.target.closest('#guide-popup')) return;
            
            const width = window.innerWidth;
            const x = e.clientX;
            if (x < width * 0.3) safeFlip('prev');
            else if (x > width * 0.7) safeFlip('next');
            else els.ui.classList.toggle('hidden');
        }

        document.addEventListener('keydown', (e) => { 
            if (!pageFlip) return; 
            if (e.key === "ArrowRight") safeFlip('next'); 
            if (e.key === "ArrowLeft") safeFlip('prev'); 
        });
        
        els.zoomClose.addEventListener('click',(e)=>{e.stopPropagation();els.zoomLayer.style.display='none';});

        els.btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        });

        let rt;
        window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(reloadBook, 300); });
        document.addEventListener('fullscreenchange', () => { els.btnFullscreen.innerText = document.fullscreenElement ? "축소" : "전체화면"; setTimeout(reloadBook, 200); });

        function reloadBook() {
            if(pageFlip && allPages.length>0){
                const idx = pageFlip.getCurrentPageIndex();
                pageFlip.destroy();
                els.flipbook.innerHTML='';
                allPages.forEach(p=>els.flipbook.appendChild(p));
                initFlipBook();
                setTimeout(() => { if(idx < pageFlip.getPageCount()) pageFlip.turnToPage(idx); }, 50);
            }
        }

        // ============================================================
        //  [다운로드 파일 생성]
        // ============================================================
        function downloadPortableHTML(base64Data) {
            const htmlContent = `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My E-Book 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"><\/script>
<script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"><\/script>
<style>${document.querySelector('style').innerHTML} #start-screen, .top-btn-group { display: none !important; }</style>
</head>
<body>
<div class="swipe-hint"></div>
<div id="guide-popup"><span class="guide-icon">👆</span><div class="guide-text">메뉴 열기: 화면 중앙 터치<br>페이지 넘김: 좌우 클릭</div><button class="btn-confirm" onclick="event.stopPropagation();document.getElementById('guide-popup').style.display='none'">확인했습니다</button></div>
<div id="loading"><div style="font-size:24px;margin-bottom:15px;">🔮</div>파일 준비 중...<br><span style="font-size:13px; color:#aaa;">잠시만 기다려주세요</span></div>
<div id="book-container"><div id="flipbook"></div></div>
<div id="ui-controls" class="hidden">
<div class="ui-header"><span id="page-info">0 / 0</span><button id="btn-fullscreen-toggle" onclick="toggleFull()">전체화면</button></div>
<div class="ui-body"><button class="nav-btn" onclick="SF('p')">‹</button><input type="range" id="page-slider" min="0" max="100" value="0"><button class="nav-btn" onclick="SF('n')">›</button></div>
</div>
<div id="zoom-layer"><div id="zoom-close-btn">✕</div><div id="zoom-container"><img id="zoom-img" src=""></div></div>
<script>
const embeddedPDF = "${base64Data}";
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
window.addEventListener('DOMContentLoaded', ()=>{ 
 const bin=window.atob(embeddedPDF); const len=bin.length; const bytes=new Uint8Array(len);
 for(let i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
 loadPDF(bytes.buffer);
});
const els={loading:document.getElementById('loading'),bookContainer:document.getElementById('book-container'),flipbook:document.getElementById('flipbook'),ui:document.getElementById('ui-controls'),slider:document.getElementById('page-slider'),pageInfo:document.getElementById('page-info'),zoomLayer:document.getElementById('zoom-layer'),zoomImg:document.getElementById('zoom-img'),zoomClose:document.getElementById('zoom-close-btn'),guidePopup:document.getElementById('guide-popup')};
let allPages=[],pageFlip,totalPages=0,touchStartX=0,touchStartY=0,longPressTimer=null,isFlipCooldown=false,zoomInstance=null,singlePageRatio=0.7,lastTouchTime=0,isTwoPageMode=false;
function saveLastPage(i){localStorage.setItem("lastPage",i);} function getLastPage(){return parseInt(localStorage.getItem("lastPage"))||0;}
function splitCanvas(o){const w=o.width,h=o.height,hw=Math.floor(w/2);const l=document.createElement('canvas'),r=document.createElement('canvas');l.width=hw;l.height=h;r.width=hw;r.height=h;l.getContext('2d').drawImage(o,0,0,hw,h,0,0,hw,h);r.getContext('2d').drawImage(o,hw,0,hw,h,0,0,hw,h);return[l,r];}
async function loadPDF(d){try{const pdf=await pdfjsLib.getDocument(d).promise;const p1=await pdf.getPage(1);const v1=p1.getViewport({scale:1.0});if(v1.width>v1.height*1.2){singlePageRatio=(v1.width/2)/v1.height;}else{singlePageRatio=v1.width/v1.height;}for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const v=p.getViewport({scale:2.0});const c=document.createElement('canvas');c.width=v.width;c.height=v.height;const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);await p.render({canvasContext:ctx,viewport:v}).promise;if(v.width>v.height*1.2){const[l,r]=splitCanvas(c);l.dataset.pdfIdx=i;r.dataset.pdfIdx=i;allPages.push(l);allPages.push(r);}else{c.classList.add('page-canvas');c.dataset.pdfIdx=i;allPages.push(c);}els.loading.innerHTML='<div>🔮</div> ('+i+'/'+pdf.numPages+')';}els.flipbook.innerHTML='';allPages.forEach(p=>els.flipbook.appendChild(p));els.loading.style.display='none';initFlipBook();setTimeout(()=>{els.guidePopup.style.display='block';},500);}catch(e){alert('Err: '+e.message);}}
function initFlipBook(){
 const w=els.bookContainer.clientWidth, h=els.bookContainer.clientHeight; if(w<=0||h<=0){setTimeout(initFlipBook,100);return;}
 const isL=w>h; isTwoPageMode=isL; const pad=isL?60:30; const aW=w-pad, aH=h-pad; let bH, bW;
 if(isL){bH=aH;bW=(bH*singlePageRatio)*2;if(bW>aW){bW=aW;bH=(bW/2)/singlePageRatio;}}else{bH=aH;bW=bH*singlePageRatio;if(bW>aW){bW=aW;bH=bW/singlePageRatio;}}
 bW=Math.floor(bW); bH=Math.floor(bH);
 pageFlip=new St.PageFlip(els.flipbook,{width:bW,height:bH,size:'fixed',usePortrait:!isL,maxShadowOpacity:0.5,autoSize:true,showCover:true});
 pageFlip.loadFromHTML(allPages); totalPages=pageFlip.getPageCount(); els.slider.max=totalPages-1;
 const lp=getLastPage(); if(lp>0 && lp<totalPages) pageFlip.turnToPage(lp);
 pageFlip.on('flip',(e)=>{els.pageInfo.innerText=(e.data+1)+' / '+totalPages;els.slider.value=e.data;saveLastPage(e.data);});
 els.slider.addEventListener('input',(e)=>pageFlip.flip(parseInt(e.target.value)));
 els.bookContainer.addEventListener('touchstart',HTS,{passive:false}); els.bookContainer.addEventListener('touchend',HTE,{passive:false}); els.bookContainer.addEventListener('mousedown',HMD);
 els.bookContainer.addEventListener('dblclick', (e)=>{e.preventDefault(); HZ(e.clientX);});
}
function HZ(cx){const idx=pageFlip.getCurrentPageIndex();let tp=null;if(isTwoPageMode){if(cx>window.innerWidth/2){if(idx===0)tp=allPages[0];else tp=allPages[idx+1];}else{if(idx!==0)tp=allPages[idx];}}else{tp=allPages[idx];}if(tp)OZ(tp);else if(allPages[idx])OZ(allPages[idx]);}
function OZ(p){els.zoomImg.src=p.toDataURL();els.zoomLayer.style.display='block';if(zoomInstance)zoomInstance.dispose();zoomInstance=Panzoom(document.getElementById('zoom-container'),{maxScale:4,minScale:1,contain:'outside'});document.getElementById('zoom-container').addEventListener('wheel',zoomInstance.zoomWithWheel);}
function SF(d){if(isFlipCooldown)return;isFlipCooldown=true;if(d==='n'||d==='next')pageFlip.flipNext();else pageFlip.flipPrev();setTimeout(()=>{isFlipCooldown=false},800);}
function HTS(e){if(e.target.closest('#ui-controls')||e.target.closest('#guide-popup'))return;touchStartX=e.changedTouches[0].screenX;touchStartY=e.changedTouches[0].screenY;lastTouchTime=Date.now();longPressTimer=setTimeout(()=>{if(navigator.vibrate)navigator.vibrate(50);const tx=e.touches[0].clientX;if(tx>window.innerWidth/2)SF('n');else SF('p');},500);}
function HTE(e){if(e.target.closest('#ui-controls')||e.target.closest('#guide-popup'))return;clearTimeout(longPressTimer);e.preventDefault();lastTouchTime=Date.now();const tX=e.changedTouches[0].screenX, tY=e.changedTouches[0].screenY; const dX=tX-touchStartX, dY=tY-touchStartY; if(Math.abs(dY)>Math.abs(dX) && Math.abs(dY)>50){ if(dY<0)els.ui.classList.remove('hidden'); else els.ui.classList.add('hidden'); return; } if(Math.abs(dX)<20&&Math.abs(dY)<20){if(touchStartX>window.innerWidth/2)SF('n');else SF('p');}}
function HMD(e){if(Date.now()-lastTouchTime<1000)return;if(e.target.closest('#ui-controls')||e.target.closest('#guide-popup'))return; const w=window.innerWidth; const x=e.clientX; if(x<w*0.3)SF('p'); else if(x>w*0.7)SF('n'); else els.ui.classList.toggle('hidden');}
els.ui.addEventListener('touchstart',e=>e.stopPropagation());els.ui.addEventListener('touchend',e=>e.stopPropagation());
document.addEventListener('keydown', (e) => { if (!pageFlip) return; if (e.key === "ArrowRight") SF('n'); if (e.key === "ArrowLeft") SF('p'); });
els.zoomClose.addEventListener('click',(e)=>{e.stopPropagation();els.zoomLayer.style.display='none';});
function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else if(document.exitFullscreen)document.exitFullscreen();}
document.addEventListener('fullscreenchange',()=>{setTimeout(reloadBook,200);});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(reloadBook,300);});
function reloadBook(){if(pageFlip&&allPages.length>0){const idx=pageFlip.getCurrentPageIndex();pageFlip.destroy();els.flipbook.innerHTML='';allPages.forEach(p=>els.flipbook.appendChild(p));initFlipBook();setTimeout(()=>{if(idx<pageFlip.getPageCount())pageFlip.turnToPage(idx);},50);}}
<\/script></body></html>`;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'My_E-Book.html';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>

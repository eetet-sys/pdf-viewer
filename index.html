<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart E-Book Final</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0c29">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    
    <style>
        /* 2026 Future Design Theme */
        :root { 
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            --glass-bg: rgba(20, 20, 28, 0.9);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent: #00f260; 
            --text: #ffffff;
        }
        
        * { box-sizing: border-box; }

        body { 
            margin: 0; padding: 0; 
            background: var(--bg-gradient); color: var(--text); 
            font-family: 'Pretendard', sans-serif; 
            overflow: hidden; 
            height: 100dvh; width: 100vw; 
            display: flex; flex-direction: column; 
            user-select: none; -webkit-user-select: none; 
            touch-action: none; 
        }
        
        /* 전체화면 배경 */
        body:fullscreen, #book-container:fullscreen { background: #000; width: 100vw; height: 100vh; }

        #book-container { 
            flex: 1; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; position: relative; z-index: 1; 
        }

        /* 책 스타일 */
        .stf__wrapper { box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .page-canvas { width: 100%; height: 100%; object-fit: contain; }

        /* UI 컨트롤 */
        #ui-controls { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 500px;
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 15px 20px; 
            display: flex; flex-direction: column; gap: 10px; 
            z-index: 100; border-radius: 25px; 
            border: 1px solid var(--glass-border);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #ui-controls.hidden { transform: translate(-50%, 150%); opacity: 0; pointer-events: none; }
        
        .control-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .control-bottom { display: flex; align-items: center; gap: 15px; }

        #page-info { font-size: 14px; font-weight: bold; color: #ddd; font-variant-numeric: tabular-nums; }
        
        button.ui-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: var(--accent); padding: 5px 12px; border-radius: 15px; font-size: 13px; cursor: pointer;
        }
        
        .nav-btn {
            width: 40px; height: 40px; border-radius: 50%; background: transparent; border: 1px solid rgba(255,255,255,0.3);
            color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .nav-btn:active { background: var(--accent); color: #000; }

        input[type=range] {
            flex: 1; height: 5px; -webkit-appearance: none; background: rgba(255,255,255,0.2); border-radius: 5px; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; background: var(--accent); border-radius: 50%; cursor: pointer;
        }

        /* 시작 화면 */
        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-gradient); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-main { background: linear-gradient(90deg, #0575E6, #00f260); color: #fff; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(0, 242, 96, 0.4); }
        
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 200; color: white; background: rgba(0,0,0,0.8); padding: 20px 40px; border-radius: 20px; text-align: center; }

        /* 줌 레이어 */
        #zoom-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 300; display: none; }
        #zoom-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #zoom-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #zoom-close { position: absolute; top: 30px; right: 30px; color: white; font-size: 30px; cursor: pointer; z-index: 301; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;}
        
        /* 팝업 토스트 */
        #guide-popup { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; z-index: 150; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body>

    <div id="guide-popup"></div>

    <div id="start-screen">
        <h1 style="margin-bottom: 20px; color:white;">Smart E-Book</h1>
        <button class="btn-main" onclick="document.getElementById('file-input').click()">PDF 파일 열기</button>
        <input type="file" id="file-input" accept="application/pdf" style="display: none;">
        <div style="margin-top: 30px; display: flex; gap: 10px;">
            <button class="ui-btn" id="btn-export">공유 파일 저장</button>
            <button class="ui-btn" id="btn-reset">초기화</button>
        </div>
        <p style="margin-top: 20px; font-size: 13px; color: #aaa;">원본 비율 유지 | 3D 효과 | 클릭 보호</p>
    </div>

    <div id="loading">분석 중...</div>

    <div id="book-container">
        <div id="flipbook"></div>
    </div>

    <div id="ui-controls" class="hidden">
        <div class="control-top">
            <span id="page-info">준비됨</span>
            <button class="ui-btn" onclick="toggleFull()">전체화면</button>
        </div>
        <div class="control-bottom">
            <button class="nav-btn" id="btn-prev">‹</button>
            <input type="range" id="page-slider" min="0" max="100" value="0">
            <button class="nav-btn" id="btn-next">›</button>
        </div>
    </div>

    <div id="zoom-layer">
        <div id="zoom-close">✕</div>
        <div id="zoom-container"><img id="zoom-img"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // === 전역 변수 ===
        const els = {
            fileInput: document.getElementById('file-input'),
            startScreen: document.getElementById('start-screen'),
            loading: document.getElementById('loading'),
            bookContainer: document.getElementById('book-container'),
            flipbook: document.getElementById('flipbook'),
            ui: document.getElementById('ui-controls'),
            slider: document.getElementById('page-slider'),
            info: document.getElementById('page-info'),
            zoomLayer: document.getElementById('zoom-layer'),
            zoomImg: document.getElementById('zoom-img'),
            popup: document.getElementById('guide-popup')
        };

        let pageFlip;
        let allPages = [];
        let pdfDoc = null;
        let totalPages = 0;
        let singlePageRatio = 0.7; // 1장 기준 비율 (세로/가로 아님, 가로/세로)
        let isLandscapeMode = false;
        
        let clickTimer = null;
        let isInteracting = false;

        // DB 관련
        const DB_NAME="EbookDB", STORE_NAME="files";
        function openDB(){ return new Promise((r,j)=>{ const q=indexedDB.open(DB_NAME,1); q.onupgradeneeded=e=>e.target.result.createObjectStore(STORE_NAME); q.onsuccess=e=>r(e.target.result); q.onerror=j; }); }
        async function saveDB(d){ const db=await openDB(); const tx=db.transaction(STORE_NAME,"readwrite"); tx.objectStore(STORE_NAME).put(d,"pdf"); return new Promise(r=>tx.oncomplete=r); }
        async function loadDB(){ const db=await openDB(); const tx=db.transaction(STORE_NAME,"readonly"); const r=tx.objectStore(STORE_NAME).get("pdf"); return new Promise(s=>r.onsuccess=()=>s(r.result)); }
        async function clearDB(){ const db=await openDB(); const tx=db.transaction(STORE_NAME,"readwrite"); tx.objectStore(STORE_NAME).delete("pdf"); return new Promise(r=>tx.oncomplete=r); }

        window.addEventListener('DOMContentLoaded', async () => {
            const data = await loadDB();
            if(data) { startViewer(data); }
        });

        els.fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const data = await file.arrayBuffer();
            await saveDB(data);
            startViewer(data);
        });

        document.getElementById('btn-reset').addEventListener('click', async()=>{ 
            if(confirm('초기화 하시겠습니까?')) { await clearDB(); location.reload(); }
        });

        function startViewer(data) {
            els.startScreen.style.display = 'none';
            els.loading.style.display = 'block';
            els.ui.classList.remove('hidden');
            processPDF(data);
        }

        async function processPDF(data) {
            try {
                pdfDoc = await pdfjsLib.getDocument(data).promise;
                const p1 = await pdfDoc.getPage(1);
                const v1 = p1.getViewport({scale: 1});
                
                // [비율 계산 복구] 첫 번째 코드의 비율 로직
                // 가로가 세로보다 넓으면 펼침면(2장)으로 간주 -> 비율은 절반 너비 기준
                if (v1.width > v1.height * 1.2) {
                    singlePageRatio = (v1.width / 2) / v1.height;
                } else {
                    singlePageRatio = v1.width / v1.height;
                }

                allPages = [];
                els.flipbook.innerHTML = "";

                for(let i=1; i<=pdfDoc.numPages; i++) {
                    els.loading.innerText = `생성 중... ${i}/${pdfDoc.numPages}`;
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({scale: 1.5}); // 선명도 1.5배
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0,0,canvas.width, canvas.height);
                    
                    await page.render({canvasContext: ctx, viewport}).promise;

                    if (viewport.width > viewport.height * 1.2) {
                        const [left, right] = splitImage(canvas);
                        allPages.push(left);
                        allPages.push(right);
                    } else {
                        canvas.className = "page-canvas";
                        allPages.push(canvas);
                    }
                }
                
                els.loading.style.display = 'none';
                createFlipBook();

            } catch(e) {
                alert("오류: " + e.message);
                els.startScreen.style.display = 'flex';
                els.loading.style.display = 'none';
            }
        }

        function splitImage(canvas) {
            const w = canvas.width, h = canvas.height, hw = Math.floor(w/2);
            const l = document.createElement('canvas'); l.width = hw; l.height = h; l.className = 'page-canvas';
            const r = document.createElement('canvas'); r.width = hw; r.height = h; r.className = 'page-canvas';
            
            l.getContext('2d').drawImage(canvas, 0, 0, hw, h, 0, 0, hw, h);
            r.getContext('2d').drawImage(canvas, hw, 0, hw, h, 0, 0, hw, h);
            return [l, r];
        }

        // === [책 생성 - 첫 번째 코드 스타일의 비율 유지 로직] ===
        function createFlipBook() {
            if (pageFlip) pageFlip.destroy();
            els.flipbook.innerHTML = "";
            allPages.forEach(p => els.flipbook.appendChild(p));

            const wrapperW = els.bookContainer.clientWidth;
            const wrapperH = els.bookContainer.clientHeight;
            
            isLandscapeMode = wrapperW > wrapperH; 
            
            const padding = isLandscapeMode ? 60 : 30;
            const availW = wrapperW - padding;
            const availH = wrapperH - padding;

            let bookW, bookH;

            // [비율 계산 핵심]
            // "화면에 꽉 차되 비율은 깨지지 않음" (Contain Logic)
            if (isLandscapeMode) {
                // PC: 2쪽 보기
                const targetRatio = singlePageRatio * 2; // 목표 가로/세로 비율
                
                // 높이를 화면 가득 채웠을 때 너비가 화면을 넘는지 확인
                bookH = availH;
                bookW = bookH * targetRatio;

                if (bookW > availW) {
                    // 너비가 넘치면 너비 기준으로 다시 맞춤
                    bookW = availW;
                    bookH = bookW / targetRatio;
                }
            } else {
                // 모바일: 1쪽 보기
                const targetRatio = singlePageRatio;
                
                bookH = availH;
                bookW = bookH * targetRatio;

                if (bookW > availW) {
                    bookW = availW;
                    bookH = bookW / targetRatio;
                }
            }

            bookW = Math.floor(bookW);
            bookH = Math.floor(bookH);

            pageFlip = new St.PageFlip(els.flipbook, {
                width: bookW,
                height: bookH,
                size: 'fixed', // 늘어남 방지 (Fixed Size + Calculated Dimension)
                usePortrait: !isLandscapeMode,
                maxShadowOpacity: 0.5,
                autoSize: true,
                showCover: true
            });

            pageFlip.loadFromHTML(document.querySelectorAll(".page-canvas"));
            
            totalPages = pageFlip.getPageCount();
            els.slider.max = totalPages - 1;
            
            pageFlip.on('flip', (e) => {
                els.info.innerText = `${e.data + 1} / ${totalPages}`;
                els.slider.value = e.data;
            });
        }

        // === 리사이즈 ===
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if(allPages.length > 0) createFlipBook();
            }, 100);
        });

        // === [클릭 & 더블클릭 충돌 방지 + 중앙 보호 구역] ===
        // 통합 이벤트 리스너
        els.bookContainer.addEventListener('mousedown', handleInputStart);
        els.bookContainer.addEventListener('mouseup', handleInputEnd);
        els.bookContainer.addEventListener('touchstart', handleInputStart, {passive: true});
        els.bookContainer.addEventListener('touchend', handleInputEnd);

        let startX = 0, startTime = 0;

        function handleInputStart(e) {
            isInteracting = true;
            startX = e.clientX || e.touches[0].clientX;
            startTime = Date.now();
        }

        function handleInputEnd(e) {
            if(!isInteracting) return;
            isInteracting = false;
            
            const endX = e.clientX || e.changedTouches[0].clientX;
            const diff = startX - endX;
            const timeDiff = Date.now() - startTime;

            // 1. 스와이프 (빠른 드래그) -> 즉시 실행
            if (Math.abs(diff) > 50 && timeDiff < 300) {
                if (diff > 0) pageFlip.flipNext();
                else pageFlip.flipPrev();
                return;
            }

            // 2. 단순 클릭 -> 스마트 로직 (더블클릭 대기 + 중앙 보호)
            if (Math.abs(diff) < 10 && timeDiff < 300) {
                const clickY = e.clientY || e.changedTouches[0].clientY;
                handleSmartClick(endX, clickY);
            }
        }

        function handleSmartClick(x, y) {
            // 이미 타이머가 돌고 있다면 -> 이건 더블클릭의 두 번째 클릭이다!
            if (clickTimer) {
                clearTimeout(clickTimer);
                clickTimer = null;
                // 더블클릭 액션 실행 (줌)
                handleZoom(x);
            } else {
                // 첫 번째 클릭 -> 0.25초만 기다려본다 (사용자가 또 누를지)
                clickTimer = setTimeout(() => {
                    // 시간 땡! 추가 클릭 없었음 -> 이건 단순 클릭(페이지 넘김)이다.
                    
                    // [중앙 10% 보호 구역 체크 - PC 모드일 때만]
                    if (isLandscapeMode) {
                        const w = window.innerWidth;
                        const h = window.innerHeight;
                        // 왼쪽 중앙
                        const lSafe = (x > w*0.2 && x < w*0.3) && (y > h*0.45 && y < h*0.55);
                        // 오른쪽 중앙
                        const rSafe = (x > w*0.7 && x < w*0.8) && (y > h*0.45 && y < h*0.55);

                        if (lSafe || rSafe) {
                            showToast("더블클릭 영역입니다");
                        } else {
                            if (x < w / 2) pageFlip.flipPrev(); else pageFlip.flipNext();
                        }
                    } else {
                        // 모바일: 좌우 넘김
                        if (x < window.innerWidth * 0.3) pageFlip.flipPrev();
                        else if (x > window.innerWidth * 0.7) pageFlip.flipNext();
                        else els.ui.classList.toggle('hidden');
                    }
                    clickTimer = null;
                }, 250); // 0.25초 딜레이
            }
        }

        function showToast(msg) {
            els.popup.innerText = msg;
            els.popup.style.opacity = 1;
            setTimeout(() => els.popup.style.opacity = 0, 1000);
        }

        // 줌 로직 (좌/우 구분)
        function handleZoom(clickX) {
            const currentIdx = pageFlip.getCurrentPageIndex();
            let targetImg = null;

            if (isLandscapeMode) {
                const center = window.innerWidth / 2;
                if (clickX < center) {
                    if (currentIdx > 0) targetImg = allPages[currentIdx]; // 왼쪽
                } else {
                    // 오른쪽
                    if (currentIdx === 0) targetImg = allPages[0];
                    else if (currentIdx + 1 < allPages.length) targetImg = allPages[currentIdx + 1];
                }
            } else {
                targetImg = allPages[currentIdx];
            }

            if (targetImg) {
                els.zoomImg.src = targetImg.toDataURL();
                els.zoomLayer.style.display = 'flex';
                const pz = Panzoom(document.getElementById('zoom-container'), {maxScale:4});
                document.getElementById('zoom-container').onwheel = pz.zoomWithWheel;
            }
        }

        document.getElementById('zoom-close').onclick = () => els.zoomLayer.style.display = 'none';
        els.slider.addEventListener('input', e => pageFlip.flip(parseInt(e.target.value)));
        document.getElementById('btn-prev').onclick = () => pageFlip.flipPrev();
        document.getElementById('btn-next').onclick = () => pageFlip.flipNext();

        function toggleFull() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        // === [3D 기능 포함 내보내기] ===
        document.getElementById('btn-export').addEventListener('click', async () => {
            if(allPages.length === 0) return alert('파일 없음');
            if(!confirm('저장된 파일을 열 때 인터넷 연결이 필요합니다.\n(3D 엔진 로드용)\n\n진행할까요?')) return;
            
            els.loading.style.display = 'block';
            els.loading.innerText = "파일 생성 중...";

            setTimeout(() => {
                const images = allPages.map(c => c.toDataURL('image/jpeg', 0.8));
                const json = JSON.stringify(images);
                const html = create3DOfflineHTML(json, singlePageRatio);
                const blob = new Blob([html], {type: 'text/html'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'My_Ebook_Share.html';
                link.click();
                els.loading.style.display = 'none';
            }, 100);
        });

        // 내보낼 HTML 템플릿 (현재 로직 그대로 복사)
        function create3DOfflineHTML(jsonImages, ratio) {
            const css = document.querySelector('style').innerHTML;
            
            return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared 3D E-Book</title>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"><\/script>
<script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"><\/script>
<style>${css} #start-screen, .top-btn-group {display:none!important} body {background: #111;}</style>
</head>
<body>
<div id="guide-popup"></div>
<div id="book-container"><div id="flipbook"></div></div>
<div id="ui-controls" class="hidden">
 <div class="control-top"><span id="page-info">0/0</span><button class="ui-btn" onclick="toggleFull()">전체화면</button></div>
 <div class="control-bottom"><button class="nav-btn" id="btn-prev">‹</button><input type="range" id="page-slider"><button class="nav-btn" id="btn-next">›</button></div>
</div>
<div id="zoom-layer"><div id="zoom-close">✕</div><div id="zoom-container"><img id="zoom-img"></div></div>
<script>
const imageSrcs = ${jsonImages};
const singlePageRatio = ${ratio};
let pageFlip, totalPages=0, isLandscapeMode=false, clickTimer=null, isInteracting=false;
const els={bookContainer:document.getElementById('book-container'),flipbook:document.getElementById('flipbook'),ui:document.getElementById('ui-controls'),slider:document.getElementById('page-slider'),info:document.getElementById('page-info'),zoomLayer:document.getElementById('zoom-layer'),zoomImg:document.getElementById('zoom-img'),popup:document.getElementById('guide-popup')};

function init() {
    els.flipbook.innerHTML = "";
    imageSrcs.forEach(src => {
        const img = document.createElement('img');
        img.src = src; img.className = 'page-canvas';
        els.flipbook.appendChild(img);
    });
    // 이미지 로딩 대기 후 실행
    setTimeout(createFlipBook, 100);
}

function createFlipBook() {
    if (pageFlip) pageFlip.destroy();
    const w = els.bookContainer.clientWidth;
    const h = els.bookContainer.clientHeight;
    isLandscapeMode = w > h; 
    const pad = isLandscapeMode ? 60 : 20;
    const aW = w - pad; const aH = h - pad;
    let bW, bH;

    if (isLandscapeMode) {
        const tR = singlePageRatio * 2;
        const sR = aW / aH;
        if (sR > tR) { bH = aH; bW = bH * tR; } else { bW = aW; bH = bW / tR; }
    } else {
        const tR = singlePageRatio;
        const sR = aW / aH;
        if (sR > tR) { bH = aH; bW = bH * tR; } else { bW = aW; bH = bW / tR; }
    }
    
    pageFlip = new St.PageFlip(els.flipbook, {
        width: Math.floor(bW), height: Math.floor(bH), size: 'fixed', usePortrait: !isLandscapeMode,
        maxShadowOpacity: 0.5, autoSize: true, showCover: true
    });
    
    pageFlip.loadFromHTML(document.querySelectorAll(".page-canvas"));
    totalPages = pageFlip.getPageCount();
    els.slider.max = totalPages - 1;
    pageFlip.on('flip', (e) => { els.info.innerText = (e.data+1)+'/'+totalPages; els.slider.value = e.data; });
}

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { createFlipBook(); }, 200); });

els.bookContainer.addEventListener('mousedown', start); els.bookContainer.addEventListener('mouseup', end);
els.bookContainer.addEventListener('touchstart', start, {passive:true}); els.bookContainer.addEventListener('touchend', end);
let sX=0, sT=0;
function start(e){ isInteracting=true; sX=e.clientX||e.touches[0].clientX; sT=Date.now(); }
function end(e){ if(!isInteracting)return; isInteracting=false; const eX=e.clientX||e.changedTouches[0].clientX; const diff=sX-eX; if(Math.abs(diff)>50 && Date.now()-sT<300){ if(diff>0)pageFlip.flipNext(); else pageFlip.flipPrev(); return; } if(Math.abs(diff)<10) handleSmartClick(eX, e.clientY||e.changedTouches[0].clientY); }

function handleSmartClick(x, y) {
    if(clickTimer) { clearTimeout(clickTimer); clickTimer=null; handleZoom(x); }
    else {
        clickTimer = setTimeout(() => {
            if (isLandscapeMode) {
                const w = window.innerWidth, h = window.innerHeight;
                const lSafe = (x>w*0.2 && x<w*0.3) && (y>h*0.45 && y<h*0.55);
                const rSafe = (x>w*0.7 && x<w*0.8) && (y>h*0.45 && y<h*0.55);
                if(lSafe || rSafe) { showToast("더블클릭 영역"); }
                else { if(x < w/2) pageFlip.flipPrev(); else pageFlip.flipNext(); }
            } else {
                if(x < window.innerWidth*0.3) pageFlip.flipPrev();
                else if(x > window.innerWidth*0.7) pageFlip.flipNext();
                else els.ui.classList.toggle('hidden');
            }
            clickTimer = null;
        }, 250);
    }
}
function handleZoom(x) {
    const idx = pageFlip.getCurrentPageIndex();
    let src = null;
    if(isLandscapeMode) {
        if(x < window.innerWidth/2) { if(idx>0) src=imageSrcs[idx]; }
        else { if(idx===0) src=imageSrcs[0]; else if(idx+1 < imageSrcs.length) src=imageSrcs[idx+1]; }
    } else { src=imageSrcs[idx]; }
    if(src) { els.zoomImg.src=src; els.zoomLayer.style.display='flex'; const pz=Panzoom(document.getElementById('zoom-container'),{maxScale:4}); document.getElementById('zoom-container').onwheel=pz.zoomWithWheel; }
}
function showToast(m){ els.popup.innerText=m; els.popup.style.opacity=1; setTimeout(()=>els.popup.style.opacity=0,1000); }
document.getElementById('zoom-close').onclick=()=>els.zoomLayer.style.display='none';
els.slider.addEventListener('input', e=>pageFlip.flip(parseInt(e.target.value)));
document.getElementById('btn-prev').onclick=()=>pageFlip.flipPrev();
document.getElementById('btn-next').onclick=()=>pageFlip.flipNext();
function toggleFull(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

init();
<\/script></body></html>`;
        }

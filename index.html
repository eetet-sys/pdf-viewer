<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My E-Book Stable Version</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    
    <style>
        :root { 
            --bg: #1a1a2e;
            --glass: rgba(255, 255, 255, 0.1);
            --accent: #00f260; 
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; padding: 0; background: var(--bg); color: #fff; 
            font-family: sans-serif; overflow: hidden; height: 100dvh; 
            display: flex; flex-direction: column; 
        }
        
        #book-container { 
            flex: 1; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; overflow: hidden;
        }

        /* 캔버스 설정: 비율 깨짐 절대 방지 */
        .page-canvas { 
            display: block; background: #fff;
            width: 100% !important; height: 100% !important;
            object-fit: contain !important; 
        }

        #menu-toggle { 
            position: fixed; top: 15px; right: 15px; z-index: 150; 
            width: 40px; height: 40px; border-radius: 50%; 
            background: var(--glass); border: 1px solid rgba(255,255,255,0.2); 
            color: white; cursor: pointer; font-size: 20px;
            backdrop-filter: blur(5px);
        }

        #ui-controls { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 80%; max-width: 400px; background: rgba(0,0,0,0.8);
            padding: 15px; display: flex; flex-direction: column; gap: 10px; 
            z-index: 100; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
            transition: opacity 0.3s;
        }
        #ui-controls.hidden { opacity: 0; pointer-events: none; }
        
        .row { display: flex; align-items: center; justify-content: space-between; }
        #page-info { font-size: 13px; font-weight: bold; color: #aaa; }
        
        .nav-btn {
            width: 35px; height: 35px; border-radius: 50%; background: #333; 
            border: none; color: #fff; cursor: pointer;
        }

        input[type=range] { flex: 1; margin: 0 10px; }

        #start-screen { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-load { background: var(--accent); color: #000; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; }
        
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; display: none; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <button id="menu-toggle">☰</button>

    <div id="start-screen">
        <button class="btn-load" onclick="document.getElementById('file-input').click()">PDF 불러오기</button>
        <input type="file" id="file-input" accept="application/pdf" style="display: none;">
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button onclick="exportFile()" style="background:none; color:#777; border:1px solid #444; padding:5px 10px; border-radius:5px; cursor:pointer;">파일 저장</button>
            <button onclick="resetDB()" style="background:none; color:#777; border:1px solid #444; padding:5px 10px; border-radius:5px; cursor:pointer;">초기화</button>
        </div>
    </div>

    <div id="loading">처리 중...</div>

    <div id="book-container">
        <div id="flipbook"></div>
    </div>

    <div id="ui-controls" class="hidden">
        <div class="row" style="justify-content:center; margin-bottom:5px;">
            <span id="page-info">0 / 0</span>
        </div>
        <div class="row">
            <button class="nav-btn" onclick="pageFlip.flipPrev()">‹</button>
            <input type="range" id="page-slider" min="0" value="0">
            <button class="nav-btn" onclick="pageFlip.flipNext()">›</button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const els = {
            fileInput: document.getElementById('file-input'),
            startScreen: document.getElementById('start-screen'),
            loading: document.getElementById('loading'),
            bookContainer: document.getElementById('book-container'),
            flipbook: document.getElementById('flipbook'),
            ui: document.getElementById('ui-controls'),
            slider: document.getElementById('page-slider'),
            info: document.getElementById('page-info'),
            menuBtn: document.getElementById('menu-toggle')
        };

        let pageFlip, allPages = [], singlePageRatio = 0.7;

        els.menuBtn.onclick = (e) => { e.stopPropagation(); els.ui.classList.toggle('hidden'); };

        // DB 로직
        const DB_NAME="SimpleEbookDB", STORE_NAME="pdf_store";
        function openDB(){ return new Promise(r=>{ const q=indexedDB.open(DB_NAME,1); q.onupgradeneeded=e=>e.target.result.createObjectStore(STORE_NAME); q.onsuccess=e=>r(e.target.result); }); }
        async function loadDB(){ const db=await openDB(); const r=db.transaction(STORE_NAME).objectStore(STORE_NAME).get("current"); return new Promise(s=>r.onsuccess=()=>s(r.result)); }
        async function saveDB(d){ const db=await openDB(); db.transaction(STORE_NAME,"readwrite").objectStore(STORE_NAME).put(d,"current"); }
        function resetDB(){ if(confirm('초기화?')){ indexedDB.deleteDatabase(DB_NAME); location.reload(); } }

        window.onload = async () => { const d = await loadDB(); if(d) startViewer(d); };
        els.fileInput.onchange = async e => { const f = e.target.files[0]; if(f){ const d = await f.arrayBuffer(); await saveDB(d); startViewer(d); } };

        function startViewer(data) {
            els.startScreen.style.display = 'none';
            els.loading.style.display = 'flex';
            renderPDF(data);
        }

        async function renderPDF(data) {
            try {
                const pdf = await pdfjsLib.getDocument(data).promise;
                const p1 = await pdf.getPage(1);
                const v1 = p1.getViewport({scale: 1});
                singlePageRatio = v1.width / v1.height;

                allPages = [];
                for(let i=1; i<=pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({scale: 1.5}); 
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    canvas.className = "page-canvas";
                    await page.render({canvasContext: ctx, viewport}).promise;
                    allPages.push(canvas);
                    els.loading.innerText = `변환 중... (${i}/${pdf.numPages})`;
                }
                els.loading.style.display = 'none';
                initFlipBook();
            } catch(e) { alert(e.message); }
        }

        function initFlipBook() {
            if (pageFlip) pageFlip.destroy();
            els.flipbook.innerHTML = "";
            allPages.forEach(p => els.flipbook.appendChild(p));

            const w = els.bookContainer.clientWidth;
            const h = els.bookContainer.clientHeight;
            const isLandscape = w > h;

            // [오류 방지 핵심: Contain 로직]
            // 화면 높이나 너비 중 더 좁은 곳에 맞춰 크기를 고정합니다.
            const pad = 40;
            const aW = w - pad;
            const aH = h - pad;
            let bW, bH;

            if (isLandscape) {
                // PC 모드 (2쪽)
                const targetRatio = singlePageRatio * 2;
                if (aW / aH > targetRatio) { bH = aH; bW = bH * targetRatio; } 
                else { bW = aW; bH = bW / targetRatio; }
            } else {
                // 모바일 모드 (1쪽)
                if (aW / aH > singlePageRatio) { bH = aH; bW = bH * singlePageRatio; } 
                else { bW = aW; bH = bW / singlePageRatio; }
            }

            pageFlip = new St.PageFlip(els.flipbook, {
                width: Math.floor(bW / (isLandscape ? 2 : 1)), 
                height: Math.floor(bH),
                size: 'fixed', // 크기를 고정하여 이미지 늘어남 방지
                usePortrait: !isLandscape,
                showCover: true,
                drawShadow: true,
                mobileScrollSupport: false
            });

            pageFlip.loadFromHTML(allPages);
            els.slider.max = pageFlip.getPageCount() - 1;
            pageFlip.on('flip', (e) => {
                els.info.innerText = `${e.data + 1} / ${pageFlip.getPageCount()}`;
                els.slider.value = e.data;
            });
        }

        let rt; window.onresize = () => { clearTimeout(rt); rt = setTimeout(initFlipBook, 200); };

        els.bookContainer.onclick = (e) => {
            if (e.target.closest('#ui-controls') || e.target.closest('#menu-toggle')) return;
            if (e.clientX < window.innerWidth / 2) pageFlip.flipPrev();
            else pageFlip.flipNext();
        };

        els.slider.oninput = e => pageFlip.flip(parseInt(e.target.value));

        function exportFile() {
            const imgs = allPages.map(c => c.toDataURL('image/jpeg', 0.8));
            const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>E-Book</title>
            <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"><\/script>
            <style>${document.querySelector('style').innerHTML} #start-screen {display:none!important}</style></head>
            <body><button id="menu-toggle">☰</button><div id="book-container"><div id="flipbook"></div></div>
            <div id="ui-controls" class="hidden"><div class="row" style="justify-content:center;margin-bottom:5px;"><span id="page-info">0 / 0</span></div>
            <div class="row"><button class="nav-btn" onclick="pageFlip.flipPrev()">‹</button><input type="range" id="page-slider" oninput="pageFlip.flip(parseInt(this.value))"><button class="nav-btn" onclick="pageFlip.flipNext()">›</button></div></div>
            <script>
                const srcs = ${JSON.stringify(imgs)}; const ratio = ${singlePageRatio};
                const els = { container: document.getElementById('book-container'), flipbook: document.getElementById('flipbook'), info: document.getElementById('page-info'), slider: document.getElementById('page-slider'), ui: document.getElementById('ui-controls') };
                let pageFlip;
                document.getElementById('menu-toggle').onclick = () => els.ui.classList.toggle('hidden');
                function init() {
                    els.flipbook.innerHTML = "";
                    srcs.forEach(s => { const img = new Image(); img.src = s; img.className = 'page-canvas'; els.flipbook.appendChild(img); });
                    render();
                }
                function render() {
                    if(pageFlip) pageFlip.destroy();
                    const w = els.container.clientWidth, h = els.container.clientHeight, isL = w > h;
                    const aW = w-40, aH = h-40; let bW, bH, tR = isL ? ratio*2 : ratio;
                    if(aW/aH > tR) { bH = aH; bW = bH * tR; } else { bW = aW; bH = bW / tR; }
                    pageFlip = new St.PageFlip(els.flipbook, { width: Math.floor(bW/(isL?2:1)), height: Math.floor(bH), size: 'fixed', usePortrait: !isL, showCover: true });
                    pageFlip.loadFromHTML(document.querySelectorAll('img'));
                    els.slider.max = pageFlip.getPageCount()-1;
                    pageFlip.on('flip', e => { els.info.innerText = (e.data+1)+'/'+pageFlip.getPageCount(); els.slider.value = e.data; });
                }
                window.onclick = e => { if(!e.target.closest('#ui-controls')) { if(e.clientX < window.innerWidth/2) pageFlip.flipPrev(); else pageFlip.flipNext(); } };
                window.onresize = render; init();
            <\/script></body></html>`;
            const blob = new Blob([html], {type: 'text/html'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "My_Ebook.html"; a.click();
        }
    </script>
</body>
</html>

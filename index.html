<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart E-Book Viewer 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    
    <style>
        :root {
            --bg-color: #121214;
            --ui-bg: rgba(20, 20, 20, 0.85); /* 반투명 블랙 */
            --accent: #64c8ff;
            --text: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text);
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden; /* 스크롤 방지 */
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
        }

        /* === [1] 메인 책 영역 === */
        #book-container {
            flex: 1; /* 남은 공간 모두 차지 */
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        /* === [2] 하단 UI 컨트롤 (플로팅 방식) === */
        #ui-controls {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 20px 10px 30px 10px; /* 터치 영역 확보 */
            display: flex; flex-direction: column; gap: 10px;
            z-index: 10;
            transition: transform 0.3s ease; /* 부드럽게 사라짐 */
            box-sizing: border-box;
        }

        /* UI 숨김 상태 */
        #ui-controls.hidden { transform: translateY(100%); }

        .control-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            padding: 0 10px; box-sizing: border-box;
        }

        #page-slider {
            width: 100%; height: 6px; -webkit-appearance: none;
            background: rgba(255,255,255,0.3); border-radius: 3px; outline: none;
        }
        #page-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px;
            background: var(--accent); border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 10px rgba(100,200,255,0.5);
        }

        #page-info { font-size: 14px; color: #ddd; font-weight: bold; }
        
        .btn-icon {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; border-radius: 5px; padding: 5px 10px; font-size: 14px;
            cursor: pointer;
        }

        /* === [3] 시작 & 로딩 화면 === */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-upload {
            background-color: var(--accent); color: #000; border: none;
            padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 50px;
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.4);
        }
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; z-index: 90; font-size: 18px; color: var(--accent);
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;
        }

        /* === [4] 줌 오버레이 (확대 모드) === */
        #zoom-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 999; display: none; /* 기본 숨김 */
            overflow: hidden;
        }
        #zoom-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #zoom-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        #zoom-close-btn {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.5); color: white; border: 2px solid white;
            width: 40px; height: 40px; border-radius: 50%; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000;
        }
        #zoom-hint {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #aaa; font-size: 12px; pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="start-screen">
        <h2 style="color:var(--accent); margin-bottom: 10px;">Smart Viewer 2026</h2>
        <p style="color:#888; margin-bottom: 40px; font-size: 14px;">화면을 두 번 탭하면 확대됩니다.</p>
        <input type="file" id="file-input" accept="application/pdf" style="display: none;">
        <button class="btn-upload" onclick="document.getElementById('file-input').click()">PDF 파일 열기</button>
    </div>

    <div id="loading">페이지 변환 중...</div>

    <div id="book-container">
        <div id="flipbook"></div>
    </div>

    <div id="ui-controls">
        <div class="control-row" style="margin-bottom: 10px;">
            <span id="page-info">0 / 0</span>
            <button class="btn-icon" id="btn-fullscreen">전체화면</button>
        </div>
        <div class="control-row">
            <input type="range" id="page-slider" min="0" max="100" value="0">
        </div>
    </div>

    <div id="zoom-layer">
        <div id="zoom-close-btn">✕</div>
        <div id="zoom-container">
            <img id="zoom-img" src="" alt="Zoom Image">
        </div>
        <div id="zoom-hint">두 손가락으로 확대/이동 가능</div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const els = {
            fileInput: document.getElementById('file-input'),
            startScreen: document.getElementById('start-screen'),
            loading: document.getElementById('loading'),
            bookContainer: document.getElementById('book-container'),
            flipbook: document.getElementById('flipbook'),
            ui: document.getElementById('ui-controls'),
            slider: document.getElementById('page-slider'),
            pageInfo: document.getElementById('page-info'),
            btnFullscreen: document.getElementById('btn-fullscreen'),
            zoomLayer: document.getElementById('zoom-layer'),
            zoomImg: document.getElementById('zoom-img'),
            zoomClose: document.getElementById('zoom-close-btn')
        };

        let pageFlip;
        let totalPages = 0;
        let pdfDoc = null;
        let zoomInstance = null;
        let lastTap = 0; // 더블 탭 감지용

        // 1. 파일 선택
        els.fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            els.startScreen.style.display = 'none';
            els.loading.style.display = 'block';
            await loadPDF(await file.arrayBuffer());
        });

        // 2. 캔버스 분할 함수
        function splitCanvas(original) {
            const w = original.width, h = original.height, halfW = Math.floor(w / 2);
            const ctx = original.getContext('2d');
            const l = document.createElement('canvas'), r = document.createElement('canvas');
            l.width = halfW; l.height = h;
            r.width = halfW; r.height = h;
            l.getContext('2d').drawImage(original, 0, 0, halfW, h, 0, 0, halfW, h);
            r.getContext('2d').drawImage(original, halfW, 0, halfW, h, 0, 0, halfW, h);
            return [l, r];
        }

        // 3. PDF 로드 및 렌더링
        async function loadPDF(data) {
            try {
                pdfDoc = await pdfjsLib.getDocument(data).promise;
                const fragment = document.createDocumentFragment();

                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    // 화질을 위해 2.0배 스케일링
                    const viewport = page.getViewport({ scale: 2.0 }); 
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

                    // 가로가 긴 페이지는 반으로 자름
                    if (viewport.width > viewport.height * 1.1) {
                        const [l, r] = splitCanvas(canvas);
                        l.classList.add('page-canvas'); r.classList.add('page-canvas');
                        // 원본 인덱스 저장 (줌 기능용)
                        l.dataset.pdfIdx = i; r.dataset.pdfIdx = i; 
                        fragment.appendChild(l); fragment.appendChild(r);
                    } else {
                        canvas.classList.add('page-canvas');
                        canvas.dataset.pdfIdx = i;
                        fragment.appendChild(canvas);
                    }
                    els.loading.innerText = `변환 중... (${i}/${pdfDoc.numPages})`;
                }
                
                els.flipbook.appendChild(fragment);
                els.loading.style.display = 'none';
                initFlipBook();

            } catch (e) {
                alert("PDF 로딩 실패: " + e.message);
                els.startScreen.style.display = 'flex'; els.loading.style.display = 'none';
            }
        }

        // 4. 플립북 초기화
        function initFlipBook() {
            pageFlip = new St.PageFlip(els.flipbook, {
                width: 500, height: 700, // 기준 비율
                size: "stretch", // 부모 컨테이너에 꽉 차게 자동 조절
                minWidth: 200, maxWidth: 2000,
                minHeight: 300, maxHeight: 2000,
                showCover: true,
                usePortrait: true, // 한 페이지씩 보기 허용
                maxShadowOpacity: 0.5
            });

            pageFlip.loadFromHTML(els.flipbook.querySelectorAll('.page-canvas'));
            totalPages = pageFlip.getPageCount();
            els.slider.max = totalPages - 1;

            // 페이지 넘김 이벤트
            pageFlip.on('flip', (e) => {
                els.pageInfo.innerText = `${e.data + 1} / ${totalPages}`;
                els.slider.value = e.data;
            });

            // 슬라이더 조작
            els.slider.addEventListener('input', (e) => pageFlip.flip(parseInt(e.target.value)));

            // === [중요] 탭 이벤트 처리 (UI 토글 및 줌) ===
            els.bookContainer.addEventListener('touchend', handleTouch);
            els.bookContainer.addEventListener('click', handleTouch); // PC 클릭 대응
        }

        function handleTouch(e) {
            // 슬라이더나 UI 버튼 클릭 시 무시
            if (e.target.closest('#ui-controls')) return;

            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 300 && tapLength > 0) {
                // 더블 탭: 줌 모드 실행
                openZoomView();
                e.preventDefault();
            } else {
                // 싱글 탭: UI 토글 (약간 딜레이 줘서 더블탭과 구분)
                setTimeout(() => {
                    if (new Date().getTime() - lastTap > 350) { // 더블탭이 아닐 경우만
                         els.ui.classList.toggle('hidden');
                    }
                }, 350);
            }
            lastTap = currentTime;
        }

        // 5. 줌 모드 구현 (Panzoom 라이브러리)
        function openZoomView() {
            // 현재 보이는 페이지의 캔버스 가져오기
            const currentIdx = pageFlip.getCurrentPageIndex();
            // pageFlip 내부의 캔버스 요소 찾기 (라이브러리가 래핑하므로 구조 탐색 필요할 수 있음)
            // 간단히 현재 렌더링된 이미지를 추출
            
            // 현재 인덱스에 해당하는 캔버스를 찾습니다.
            const pages = els.flipbook.querySelectorAll('.page-canvas');
            const currentCanvas = pages[currentIdx];

            if (currentCanvas) {
                els.zoomImg.src = currentCanvas.toDataURL();
                els.zoomLayer.style.display = 'block';
                
                // Panzoom 초기화
                if (zoomInstance) zoomInstance.dispose();
                const elem = document.getElementById('zoom-container');
                zoomInstance = Panzoom(elem, {
                    maxScale: 5,
                    minScale: 1,
                    contain: 'outside'
                });
                elem.addEventListener('wheel', zoomInstance.zoomWithWheel);
            }
        }

        // 줌 닫기
        function closeZoom() {
            els.zoomLayer.style.display = 'none';
            if (zoomInstance) {
                zoomInstance.dispose();
                zoomInstance = null;
            }
        }

        // 줌 닫기 이벤트
        els.zoomClose.addEventListener('click', closeZoom);
        // 줌 레이어 더블탭 시 닫기
        els.zoomLayer.addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            if (currentTime - lastTap < 300) closeZoom();
            lastTap = currentTime;
        });


        // 6. 전체화면
        els.btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                els.btnFullscreen.innerText = "축소";
            } else {
                if(document.exitFullscreen) document.exitFullscreen();
                els.btnFullscreen.innerText = "전체화면";
            }
        });

        // 리사이즈 시 업데이트
        window.addEventListener('resize', () => {
            if (pageFlip) pageFlip.update();
        });

    </script>
</body>
</html>

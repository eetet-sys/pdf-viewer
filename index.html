<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Smart E-Book PC Fixed</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    
    <style>
        :root { 
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            --glass-bg: rgba(20, 20, 28, 0.95);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent: #00f260; 
            --text: #ffffff;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; padding: 0; 
            background: var(--bg-gradient); color: var(--text); 
            font-family: 'Pretendard', sans-serif; 
            overflow: hidden; height: 100dvh; width: 100vw; 
            display: flex; flex-direction: column; 
            user-select: none; -webkit-user-select: none; touch-action: none; 
        }
        
        #book-container { 
            flex: 1; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; z-index: 1;
            padding: 20px; /* 창 끝과 책 사이 최소 여백 */
        }

        .stf__wrapper { box-shadow: 0 30px 100px rgba(0,0,0,0.8); }
        .page-canvas { width: 100%; height: 100%; object-fit: contain; background: #fff; display: block; }

        /* 상단 메뉴 토글 버튼 */
        #menu-toggle { 
            position: fixed; top: 20px; right: 20px; z-index: 150; 
            width: 48px; height: 48px; border-radius: 50%; 
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            color: white; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 24px; backdrop-filter: blur(10px);
        }

        /* 하단 UI 컨트롤 */
        #ui-controls { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 500px;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            padding: 15px 25px; display: flex; flex-direction: column; gap: 10px; 
            z-index: 100; border-radius: 25px; border: 1px solid var(--glass-border);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #ui-controls.hidden { transform: translate(-50%, 150%); opacity: 0; pointer-events: none; }
        
        #page-info { font-size: 14px; font-weight: bold; color: #ddd; text-align: center; }
        .control-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; }

        .nav-btn {
            width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1);
            color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none;
        }
        .nav-btn:active { background: var(--accent); color: #000; }

        input[type=range] { flex: 1; height: 5px; -webkit-appearance: none; background: rgba(255,255,255,0.2); border-radius: 5px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: var(--accent); border-radius: 50%; cursor: pointer; }

        /* 초기 화면 */
        #start-screen { position: fixed; inset: 0; background: var(--bg-gradient); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-main { background: linear-gradient(90deg, #0575E6, #00f260); color: #fff; border: none; padding: 18px 50px; font-size: 18px; font-weight: 800; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 30px rgba(0, 242, 96, 0.3); }
        .ui-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #888; padding: 8px 15px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; display: none; align-items: center; justify-content: center; color: white; flex-direction: column; gap: 15px; }
    </style>
</head>
<body>

    <button id="menu-toggle">☰</button>

    <div id="start-screen">
        <h1 style="margin-bottom: 30px; font-size: 3rem;">Smart E-Book</h1>
        <button class="btn-main" onclick="document.getElementById('file-input').click()">PDF 불러오기</button>
        <input type="file" id="file-input" accept="application/pdf" style="display: none;">
        <div style="margin-top: 40px; display: flex; gap: 15px;">
            <button class="ui-btn" id="btn-export">내보내기 (3D)</button>
            <button class="ui-btn" id="btn-reset">초기화</button>
        </div>
        <p style="margin-top: 20px; color: #666; font-size: 13px;">가로 확장 시에도 양면 비율 유지</p>
    </div>

    <div id="loading">✨ 고화질로 변환하고 있습니다...</div>

    <div id="book-container">
        <div id="flipbook"></div>
    </div>

    <div id="ui-controls" class="hidden">
        <div id="page-info">0 / 0</div>
        <div class="control-row">
            <button class="nav-btn" onclick="pageFlip.flipPrev()">‹</button>
            <input type="range" id="page-slider" min="0" value="0">
            <button class="nav-btn" onclick="pageFlip.flipNext()">›</button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const els = {
            fileInput: document.getElementById('file-input'),
            startScreen: document.getElementById('start-screen'),
            loading: document.getElementById('loading'),
            bookContainer: document.getElementById('book-container'),
            flipbook: document.getElementById('flipbook'),
            ui: document.getElementById('ui-controls'),
            slider: document.getElementById('page-slider'),
            info: document.getElementById('page-info'),
            menuBtn: document.getElementById('menu-toggle')
        };

        let pageFlip, allPages = [], singlePageRatio = 0.75;

        els.menuBtn.onclick = (e) => { e.stopPropagation(); els.ui.classList.toggle('hidden'); };

        const DB_NAME="SimpleEbookDB", STORE_NAME="pdf_store";
        function openDB(){ return new Promise(r=>{ const q=indexedDB.open(DB_NAME,1); q.onupgradeneeded=e=>e.target.result.createObjectStore(STORE_NAME); q.onsuccess=e=>r(e.target.result); }); }
        async function loadDB(){ const db=await openDB(); const r=db.transaction(STORE_NAME).objectStore(STORE_NAME).get("current"); return new Promise(s=>r.onsuccess=()=>s(r.result)); }
        async function saveDB(d){ const db=await openDB(); db.transaction(STORE_NAME,"readwrite").objectStore(STORE_NAME).put(d,"current"); }
        document.getElementById('btn-reset').onclick = () => { if(confirm('초기화?')){ indexedDB.deleteDatabase(DB_NAME); location.reload(); } };

        window.onload = async () => { const d = await loadDB(); if(d) startViewer(d); };
        els.fileInput.onchange = async e => { const f = e.target.files[0]; if(f){ const d = await f.arrayBuffer(); await saveDB(d); startViewer(d); } };

        function startViewer(data) {
            els.startScreen.style.display = 'none';
            els.loading.style.display = 'flex';
            renderPDF(data);
        }

        async function renderPDF(data) {
            try {
                const pdf = await pdfjsLib.getDocument(data).promise;
                const p1 = await pdf.getPage(1);
                const v1 = p1.getViewport({scale: 1});
                singlePageRatio = v1.width / v1.height; // 가로/세로 비율

                allPages = [];
                for(let i=1; i<=pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({scale: 2.0}); 
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    canvas.className = "page-canvas";
                    await page.render({canvasContext: ctx, viewport}).promise;
                    allPages.push(canvas);
                    els.loading.innerText = `생성 중... ${i}/${pdf.numPages}`;
                }
                els.loading.style.display = 'none';
                initFlipBook();
            } catch(e) { alert(e.message); }
        }

        // === [책 초기화 및 비율 고정 로직] ===
        function initFlipBook() {
            if (pageFlip) pageFlip.destroy();
            els.flipbook.innerHTML = "";
            allPages.forEach(p => els.flipbook.appendChild(p));

            const w = els.bookContainer.clientWidth;
            const h = els.bookContainer.clientHeight;
            const isLandscape = w > h;

            // [핵심] 창 너비가 아무리 넓어져도 책은 높이(h)를 기준으로만 커지도록 고정
            const pad = 40; // 여유 공간
            const aH = h - pad;
            const aW = w - pad;
            
            let bW, bH;

            if (isLandscape) {
                // PC 모드: 높이에 맞추고 너비는 비율에 따라 자동 (2쪽 기준)
                bH = aH;
                bW = bH * (singlePageRatio * 2);

                // 만약 계산된 너비(bW)가 화면 너비(aW)보다 크면 화면 너비에 맞춤 (역전 방지)
                if (bW > aW) {
                    bW = aW;
                    bH = bW / (singlePageRatio * 2);
                }
            } else {
                // 모바일 모드: 1쪽 기준
                bH = aH;
                bW = bH * singlePageRatio;
                if (bW > aW) {
                    bW = aW;
                    bH = bW / singlePageRatio;
                }
            }

            pageFlip = new St.PageFlip(els.flipbook, {
                width: Math.floor(bW / (isLandscape ? 2 : 1)), 
                height: Math.floor(bH),
                size: 'fixed', // 크기 고정으로 늘어남 방지
                usePortrait: !isLandscape,
                showCover: true,
                drawShadow: true,
                maxShadowOpacity: 0.3,
                flippingTime: 600,
                mobileScrollSupport: false
            });

            pageFlip.loadFromHTML(allPages);
            els.slider.max = pageFlip.getPageCount() - 1;
            pageFlip.on('flip', (e) => {
                els.info.innerText = `${e.data + 1} / ${pageFlip.getPageCount()}`;
                els.slider.value = e.data;
            });
        }

        let rt; window.onresize = () => { clearTimeout(rt); rt = setTimeout(initFlipBook, 150); };

        // 클릭 넘김 (이중 방지를 위해 라이브러리 기본 클릭 무시하고 수동 제어)
        els.bookContainer.onclick = (e) => {
            if (e.target.closest('#ui-controls') || e.target.closest('#menu-toggle')) return;
            const w = window.innerWidth;
            if (e.clientX < w / 2) pageFlip.flipPrev();
            else pageFlip.flipNext();
        };

        els.slider.oninput = e => pageFlip.flip(parseInt(e.target.value));

        // 내보내기 (3D 유지)
        document.getElementById('btn-export').onclick = () => {
            const imgs = allPages.map(c => c.toDataURL('image/jpeg', 0.8));
            const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Share</title>
            <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"><\/script>
            <style>${document.querySelector('style').innerHTML} #start-screen {display:none!important}</style></head>
            <body><button id="menu-toggle">☰</button><div id="book-container"><div id="flipbook"></div></div>
            <div id="ui-controls" class="hidden"><div id="page-info">0 / 0</div>
            <div class="control-row"><button class="nav-btn" onclick="pageFlip.flipPrev()">‹</button><input type="range" id="page-slider" oninput="pageFlip.flip(parseInt(this.value))"><button class="nav-btn" onclick="pageFlip.flipNext()">›</button></div></div>
            <script>
                const srcs = ${JSON.stringify(imgs)}; const ratio = ${singlePageRatio};
                const els = { container: document.getElementById('book-container'), flipbook: document.getElementById('flipbook'), info: document.getElementById('page-info'), slider: document.getElementById('page-slider'), ui: document.getElementById('ui-controls') };
                let pageFlip;
                document.getElementById('menu-toggle').onclick = () => els.ui.classList.toggle('hidden');
                function init() {
                    els.flipbook.innerHTML = "";
                    srcs.forEach(s => { const img = new Image(); img.src = s; img.className = 'page-canvas'; els.flipbook.appendChild(img); });
                    render();
                }
                function render() {
                    if(pageFlip) pageFlip.destroy();
                    const w = els.container.clientWidth, h = els.container.clientHeight, isL = w > h;
                    const calcH = h - 40; let bW, bH, tR = isL ? ratio*2 : ratio;
                    bH = calcH; bW = bH * tR; if(bW > w-40) { bW = w-40; bH = bW / tR; }
                    pageFlip = new St.PageFlip(els.flipbook, { width: Math.floor(bW/(isL?2:1)), height: Math.floor(bH), size: 'fixed', usePortrait: !isL, showCover: true });
                    pageFlip.loadFromHTML(document.querySelectorAll('img'));
                    els.slider.max = pageFlip.getPageCount()-1;
                    pageFlip.on('flip', e => { els.info.innerText = (e.data+1)+'/'+pageFlip.getPageCount(); els.slider.value = e.data; });
                }
                window.onclick = e => { if(!e.target.closest('#ui-controls')) { if(e.clientX < window.innerWidth/2) pageFlip.flipPrev(); else pageFlip.flipNext(); } };
                window.onresize = render; init();
            <\/script></body></html>`;
            const blob = new Blob([html], {type: 'text/html'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "Ebook_Share.html"; a.click();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF → 전자책 변환기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        .step-number { font-size: 24px; font-weight: bold; color: #4F46E5; }
        .big-button { font-size: 20px; padding: 20px; font-weight: bold; transition: all 0.2s; }
        .loader { border-top-color: #4F46E5; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-2xl mx-auto space-y-6">
        <div class="bg-white rounded-3xl shadow-xl p-8">
            <header class="text-center mb-10">
                <h1 class="text-3xl font-extrabold text-gray-800 mb-2">📱 초간편 전자책 변환</h1>
                <p class="text-gray-500 text-lg">PDF를 스마트폰용 EPUB으로 바꿔보세요</p>
            </header>

            <div class="mb-6">
                <label for="file-input" class="block mb-4 cursor-pointer">
                    <div class="border-3 border-dashed border-indigo-200 rounded-2xl p-10 text-center hover:bg-indigo-50 transition-colors bg-indigo-50/30">
                        <span id="file-label" class="text-indigo-600 font-bold text-xl">PDF 파일 선택하기</span>
                        <input type="file" id="file-input" accept=".pdf" class="hidden">
                    </div>
                </label>
                <p id="file-name-display" class="text-center text-gray-600 font-medium hidden">선택됨: <span class="text-indigo-600"></span></p>
            </div>

            <div id="settings-area" class="hidden space-y-4 mb-8">
                <div class="grid grid-cols-1 gap-4">
                    <input type="text" id="title-input" placeholder="책 제목을 입력하세요" class="w-full px-5 py-4 border-2 border-gray-100 rounded-xl focus:border-indigo-500 outline-none text-lg">
                    <input type="text" id="author-input" placeholder="저자 이름 (선택)" class="w-full px-5 py-4 border-2 border-gray-100 rounded-xl focus:border-indigo-500 outline-none text-lg">
                </div>
                <button id="convert-btn" class="big-button w-full bg-indigo-600 text-white rounded-2xl hover:bg-indigo-700 shadow-lg flex items-center justify-center gap-3">
                    변환 시작하기
                </button>
            </div>

            <div id="progress-box" class="hidden p-6 bg-blue-50 rounded-2xl border border-blue-100">
                <div class="flex items-center gap-4">
                    <div class="loader w-8 h-8 border-4 border-gray-200 rounded-full"></div>
                    <div>
                        <p class="font-bold text-blue-900" id="status-text">처리 중...</p>
                        <p class="text-sm text-blue-700" id="sub-status-text">잠시만 기다려주세요</p>
                    </div>
                </div>
            </div>

            <div id="success-box" class="hidden p-8 bg-green-50 rounded-3xl border-2 border-green-200 text-center">
                <div class="text-5xl mb-4">✅</div>
                <h2 class="text-2xl font-bold text-green-800 mb-2">변환 완료!</h2>
                <p class="text-green-700 mb-6 font-medium">이제 파일을 친구들에게 공유해 보세요.</p>
                <div class="space-y-3">
                    <button id="download-btn" class="w-full py-4 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700">파일 저장하기</button>
                    <button onclick="copyShareMessage()" class="w-full py-4 bg-white border-2 border-green-200 text-green-700 rounded-xl font-bold hover:bg-green-50">공유 안내문 복사</button>
                    <button onclick="location.reload()" class="text-gray-400 text-sm underline mt-4">새로 만들기</button>
                </div>
            </div>
        </div>

        <div class="bg-gray-800 text-white rounded-2xl p-6 text-sm leading-relaxed opacity-90">
            <p class="font-bold mb-2 text-indigo-300">💡 공유 시 꿀팁</p>
            <p>• 아이폰 사용자: 카톡으로 파일을 보내면 바로 '도서' 앱에서 읽을 수 있습니다.</p>
            <p>• 갤럭시 사용자: 파일 끝에 <span class="text-yellow-400">.epub</span>이 붙어있는지 꼭 확인하세요!</p>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('file-input');
        const settingsArea = document.getElementById('settings-area');
        const convertBtn = document.getElementById('convert-btn');
        const progressBox = document.getElementById('progress-box');
        const successBox = document.getElementById('success-box');
        
        let currentBlob = null;
        let currentName = "";

        // 파일 선택 시
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                document.getElementById('file-name-display').classList.remove('hidden');
                document.getElementById('file-name-display').querySelector('span').textContent = file.name;
                document.getElementById('title-input').value = file.name.replace('.pdf', '');
                settingsArea.classList.remove('hidden');
                fileInput.parentElement.classList.add('opacity-50');
            }
        });

        // 변환 로직
        convertBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            const title = document.getElementById('title-input').value || '전자책';
            const author = document.getElementById('author-input').value || '저자 미상';

            try {
                settingsArea.classList.add('hidden');
                progressBox.classList.remove('hidden');
                
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const zip = new JSZip();

                // EPUB 기초 구조 (JPEG 기반)
                setupEpub(zip, title, author);

                let manifest = "";
                let spine = "";
                let ncx = "";

                for (let i = 1; i <= pdf.numPages; i++) {
                    document.getElementById('status-text').textContent = `${i} / ${pdf.numPages} 페이지 변환 중...`;
                    
                    // 1. 페이지 렌더링 & 리사이징 (가로 1080px 고정)
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1080 / page.getViewport({scale:1}).width });
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

                    // 2. JPEG 압축 (품질 0.75)
                    const imgData = canvas.toDataURL('image/jpeg', 0.75).split(',')[1];
                    zip.folder('OEBPS/images').file(`p${i}.jpg`, imgData, { base64: true });

                    // 3. XHTML 생성
                    const xhtml = `<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><style>body{margin:0;padding:0;}img{width:100%;height:auto;display:block;}</style></head><body><img src="images/p${i}.jpg"/></body></html>`;
                    zip.folder('OEBPS').file(`ch${i}.xhtml`, xhtml);

                    manifest += `<item id="ch${i}" href="ch${i}.xhtml" media-type="application/xhtml+xml"/><item id="img${i}" href="images/p${i}.jpg" media-type="image/jpeg"/>`;
                    spine += `<itemref idref="ch${i}"/>`;
                    ncx += `<navPoint id="n${i}"><navLabel><text>Page ${i}</text></navLabel><content src="ch${i}.xhtml"/></navPoint>`;

                    // 브라우저 멈춤 방지 (5페이지마다 휴식)
                    if (i % 5 === 0) await new Promise(r => setTimeout(r, 10));
                    canvas.width = 0; canvas.height = 0; // 메모리 해제 보조
                }

                // 메타데이터 마무리
                finalizeEpub(zip, title, manifest, spine, ncx);

                document.getElementById('status-text').textContent = `최종 파일 생성 중...`;
                currentBlob = await zip.generateAsync({ type: 'blob', mimeType: 'application/epub+zip' });
                currentName = title + ".epub";

                progressBox.classList.add('hidden');
                successBox.classList.remove('hidden');
                
                // 자동 다운로드
                saveFile(currentBlob, currentName);

            } catch (err) {
                alert("오류가 발생했습니다: " + err.message);
                location.reload();
            }
        });

        document.getElementById('download-btn').onclick = () => saveFile(currentBlob, currentName);

        function setupEpub(zip, title, author) {
            zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });
            zip.folder('META-INF').file('container.xml', `<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>`);
        }

        function finalizeEpub(zip, title, manifest, spine, ncx) {
            const opf = `<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="id"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>${title}</dc:title><dc:language>ko</dc:language></metadata><manifest>${manifest}<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/></manifest><spine toc="ncx">${spine}</spine></package>`;
            const ncxFile = `<?xml version="1.0" encoding="UTF-8"?><ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"><docTitle><text>${title}</text></docTitle><navMap>${ncx}</navMap></ncx>`;
            zip.folder('OEBPS').file('content.opf', opf);
            zip.folder('OEBPS').file('toc.ncx', ncxFile);
        }

        function saveFile(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyShareMessage() {
            const msg = `📖 전자책(EPUB)이 도착했습니다!\n\n방법:\n1. 파일을 다운로드합니다.\n2. 아이폰은 바로 열기, 갤럭시는 파일함에서 '.epub' 확장자를 확인한 후 '도서 앱'으로 열어주세요.`;
            navigator.clipboard.writeText(msg).then(() => alert("안내 문구가 복사되었습니다! 카톡에 붙여넣으세요."));
        }
    </script>
</body>
</html>
